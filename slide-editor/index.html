<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Slide Studio</title><link rel="stylesheet" href="/slide-editor/editor.css"></head><body>
<header><b>◈ Slide Studio</b><select id="decks" aria-label="选择幻灯片"></select><button id="open">打开</button><select id="language" aria-label="语言"><option value="zh-CN">中文</option><option value="en">English</option><option value="ja">日本語</option></select><span id="status">就绪</span><button id="export">导出 HTML</button><button id="save" class="primary">保存到原文件</button></header>
<nav><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="add">＋ 文本框</button><button id="duplicate">复制当前页</button><button id="preview">↗ 放映</button><label><input id="move" type="checkbox">拖动模式</label><button id="properties">属性</button><button id="sourceToggle">〈/〉源码</button></nav>
<main><aside><small>幻灯片</small><div id="slides"></div><p class="tip">单击选择 · 双击编辑<br>拖动模式下移动元素<br>⌘ / Ctrl + S 保存</p></aside><section class="workspace"><div class="caption" id="pageTitle">HTML 幻灯片编辑器</div><div id="stage"><div id="frameWrap"><iframe id="canvas" sandbox="allow-same-origin" title="幻灯片编辑画布"></iframe></div></div><p class="hint">双击文字直接输入 · Esc 结束编辑 · 修改后请保存</p><section id="sourcePane" hidden><div class="source-toolbar"><button id="applySource">应用源码</button><button id="revertSource">还原源码</button><span id="sourceLocation" aria-live="polite"></span></div><div class="source-editor"><textarea id="source" spellcheck="false" aria-label="HTML 源码"></textarea></div></section></section><aside class="inspector"><small>元素属性</small><h3 id="selection">尚未选择元素</h3><p id="selector">点击画布中的文字或图片</p><label>字号 / px<input id="fontSize" type="number" data-prop="font-size"></label><label>文字颜色<input id="color" type="color" data-prop="color"></label><label>背景颜色<input id="background" type="color" data-prop="background-color"></label><div class="row"><button id="bold"><b>B</b></button><button data-align="left">左</button><button data-align="center">中</button><button data-align="right">右</button></div><label>宽度 / px<input id="width" type="number" data-prop="width"></label><label>高度 / px<input id="height" type="number" data-prop="height"></label><label>图片地址<input id="imageSrc" placeholder="assets/example.png"></label><button id="parent">选择父容器 ↑</button><button id="delete">删除所选元素</button><p class="tip">保留标签、class、外部 CSS 和图片路径。样式修改写入标准行内 CSS，人工和 AI 都能继续编辑。</p></aside></main><script src="/slide-editor/i18n.js"></script><script src="/slide-editor/editor.js"></script></body></html>
